name: Publish Release

on:
  release:
    types: [published]

jobs:
  build-app:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.extract_version.outputs.APP_VERSION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore AIStudyHub/AIStudyHub.slnx

    - name: Extract Version
      id: extract_version
      run: |
        $version = "${{ github.ref_name }}"
        if ($version.StartsWith("v")) {
          $version = $version.Substring(1)
        }
        echo "APP_VERSION=$version" >> $env:GITHUB_OUTPUT
      
    - name: Publish app
      run: dotnet publish AIStudyHub/AIStudyHub/AIStudyHub.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.extract_version.outputs.APP_VERSION }} -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: publish-output
        path: ./publish

  publish-zip:
    needs: build-app
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: publish-output
        path: ./publish
        
    - name: Zip release
      run: Compress-Archive -Path ./publish/* -DestinationPath AIStudyHub-win-x64.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: AIStudyHub-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-installer:
    needs: build-app
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: publish-output
        path: ./publish

    - name: Build Installer
      run: iscc /DMyAppVersion=${{ needs.build-app.outputs.app_version }} installer.iss

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: InstallerOutput/AIStudyHub-Installer-win-x64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
